# A local Jira Software Data Center site for the @webship-js/jira-steps suite.
# Built and seeded by build-jira-site.sh; nothing here holds a licence key.
name: jira-steps-site

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jira
      POSTGRES_USER: jira
      POSTGRES_PASSWORD: jira
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jira -d jira"]
      interval: 5s
      timeout: 5s
      retries: 20

  jira:
    image: atlassian/jira-software:${JIRA_VERSION:-11.3.13}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${JIRA_PORT:-2990}:8080"
    environment:
      ATL_JDBC_URL: jdbc:postgresql://db:5432/jira
      ATL_JDBC_USER: jira
      ATL_JDBC_PASSWORD: jira
      ATL_DB_DRIVER: org.postgresql.Driver
      ATL_DB_TYPE: postgres72
      ATL_DB_SCHEMA_NAME: public
      JVM_MINIMUM_MEMORY: ${JIRA_HEAP_MIN:-1024m}
      JVM_MAXIMUM_MEMORY: ${JIRA_HEAP_MAX:-2048m}
      # A test site: no first-login onboarding tour, and no second password prompt
      # ("websudo") in front of the administration pages.
      JVM_SUPPORT_RECOMMENDED_ARGS: "-Datlassian.plugins.enable.wait=300 -Djira.websudo.is.disabled=true -Datlassian.darkfeature.jira.onboarding.feature.disabled=true"
    volumes:
      - jira-home:/var/atlassian/application-data/jira

volumes:
  db-data:
  jira-home:
