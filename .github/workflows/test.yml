name: Test

on:
  push:
    branches:
      - 2.0.x
  pull_request:
    branches:
      - 2.0.x
  workflow_dispatch:

permissions:
  contents: read

# The runs of a pull request share a group, so a newer push cancels the run
# it supersedes. Every other run (a push to 2.0.x, a run started by hand)
# gets a group of its own: it is never queued behind another run, and never
# cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  cucumber:
    name: jira-steps test suite
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      HEADLESS: 'true'
      # Optional: a licence key for the site build. When the secret is not set, the build
      # downloads Atlassian's public 3-hour test licence at run time. No key is in this repository.
      JIRA_LICENSE: ${{ secrets.JIRA_LICENSE }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the JSDoc examples and feature steps against the step regexes
        run: npm run test:examples

      - name: Check that a feature named on the command line runs alone
        run: npm run test:paths

      - name: Run cucumber-js dry-run (ambiguity / undefined step check)
        run: npx cucumber-js --dry-run

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build the site with Docker Compose (application, database, accounts, sample projects)
        run: site/build-jira-site.sh

      - name: Check the site is the one cucumber.js runs against by default
        run: |
          DEFAULT_URL="$(LAUNCH_URL= node -e "console.log(require('./cucumber.js').default.worldParameters.launchUrl)")"
          echo "Default: $DEFAULT_URL"
          curl -s "$DEFAULT_URL/status" | grep -q '"state":"RUNNING"'

      - name: Run jira-steps test suite
        run: npx cucumber-js

      - name: Run the suite a second time (it leaves the site as it found it)
        run: npx cucumber-js

      - name: Show the application log on failure
        if: failure()
        run: docker compose -f site/docker-compose.yml logs --tail 200 jira

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: tests/reports/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload failure screenshots and videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: |
            screenshots/
            videos/
          retention-days: 14
          if-no-files-found: ignore
